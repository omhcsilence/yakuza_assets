<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>YakuzaXsilence | Isekai Server · Dark Purple Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #0F0A1F, #02000A);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 560px;
            margin: 0 auto;
        }
        
        .card {
            background: rgba(10, 6, 20, 0.88);
            backdrop-filter: blur(14px);
            border-radius: 48px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(139, 92, 246, 0.5);
            text-align: center;
        }
        
        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #f3e8ff, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .btn {
            background: linear-gradient(135deg, #8b5cf6, #4c1d95);
            padding: 15px 25px;
            border-radius: 44px;
            border: none;
            color: white;
            font-weight: bold;
            width: 100%;
            margin: 10px 0;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.3s;
        }
        
        .btn:hover {
            transform: scale(1.02);
        }
        
        .btn-gold {
            background: linear-gradient(135deg, #eab308, #b45309);
            color: #1a1a2e;
        }
        
        .feature-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        
        .feature-card {
            background: rgba(20, 12, 36, 0.75);
            border-radius: 28px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .feature-card:hover {
            transform: translateY(-4px);
            background: rgba(76, 29, 149, 0.7);
        }
        
        .action-item {
            background: rgba(20, 12, 36, 0.7);
            border-radius: 28px;
            padding: 12px;
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .action-item:hover {
            transform: translateX(5px);
            background: rgba(76, 29, 149, 0.8);
        }
        
        .footer {
            text-align: center;
            font-size: 10px;
            color: #8B5CF6;
            margin-top: 20px;
            padding: 10px;
        }
        
        i { margin-right: 8px; }
        a { text-decoration: none; color: inherit; }
    </style>
</head>
